name: Publicar portal PARV-LAB (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Verificar contenidos y preparar el sitio
    runs-on: ubuntu-latest
    steps:
      - name: Obtener contenido original del taller
        uses: actions/checkout@v4

      - name: Comprobar portal y cuadernos
        shell: bash
        run: |
          set -e
          test -s index.html
          test -d assets
          test -d cuadernos
          test -d skills
          test -d solucionario
          for n in 01 02 03 04 05 06 07 08 09; do
            ls cuadernos/${n}-*.md >/dev/null
          done
          echo "Portal y nueve cuadernos presentes."

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar contenido estático sin transformar
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets cuadernos skills solucionario _site/
          cp README.md CREDITOS.md PLAN-MAESTRO.md _site/
          touch _site/.nojekyll

      - name: Subir archivos a Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publicar portal
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
